# Sobe o MongoDB e a API. Uso:   docker compose up --build
# Configuracao por variaveis de ambiente (veja .env.example); tudo tem valor padrao para desenvolvimento.
services:
  mongo:
    image: mongo:7.0
    container_name: aguia-mongo
    restart: unless-stopped
    # Sem autenticacao e publicado so em 127.0.0.1: uso local de desenvolvimento.
    # Em producao use um MongoDB gerenciado (ex.: Atlas) com usuario/senha via MONGODB_URI.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build: ./backend
    container_name: aguia-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/aguiainova
      # HS256 exige no minimo 32 bytes. TROQUE em qualquer ambiente que nao seja o seu computador.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-troque-em-producao-min-32-bytes!}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-desligado}
      APP_SEED_DEMO_SENHA: ${APP_SEED_DEMO_SENHA:-}
      APP_ALLOW_ROLE_SELECTION: ${APP_ALLOW_ROLE_SELECTION:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}

volumes:
  mongo-data:
