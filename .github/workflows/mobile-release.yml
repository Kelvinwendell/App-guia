name: Mobile Release

# Gera o APK de producao ASSINADO e publica no GitHub Releases, sem precisar de computador:
# GitHub (site ou app do celular) -> Actions -> "Mobile Release" -> Run workflow.
# A chave nunca fica no repositorio: vem dos secrets (passo a passo em docs/RELEASE-MOBILE.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v2.2-mobile). Deve ser nova.'
        required: true
        type: string
      teste:
        description: 'Publicar como pre-release (nao vira o "Latest")'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_PRODUCAO: https://app-guia.onrender.com/
    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltando=""
          for nome in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!nome}" ] && faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings > Secrets and variables > Actions (docs/RELEASE-MOBILE.md)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "::error::A tag ${{ inputs.tag }} ja existe. Escolha outra."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Testes unitarios (nao publica APK quebrado)
        working-directory: mobile
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restaurar a keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build do APK assinado
        working-directory: mobile
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PapiBaseUrl=$API_PRODUCAO --console=plain

      - name: Conferir assinatura e versao
        id: apk
        run: |
          apk=mobile/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::APK assinado nao foi gerado (saiu app-release-unsigned.apk?). Confira os secrets."
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | head -3
          versao=$("$bt/aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          final="aguia-inova-v${versao}.apk"
          cp "$apk" "$final"
          sha=$(sha256sum "$final" | cut -d' ' -f1)
          echo "arquivo=$final" >> "$GITHUB_OUTPUT"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          APK de producao assinado (API: \`$API_PRODUCAO\`), versao ${{ steps.apk.outputs.versao }}, commit \`${GITHUB_SHA::7}\`.

          **Instalar:** baixe o \`${{ steps.apk.outputs.arquivo }}\` pelo navegador do celular, abra e permita instalar desta fonte.
          Se aparecer conflito de assinatura, desinstale a versao anterior e instale de novo.

          SHA-256: \`${{ steps.apk.outputs.sha }}\`
          EOF
          extra=""
          [ "${{ inputs.teste }}" = "true" ] && extra="--prerelease"
          gh release create "${{ inputs.tag }}" "${{ steps.apk.outputs.arquivo }}" \
            --target "$GITHUB_SHA" --title "Águia Inova — APK v${{ steps.apk.outputs.versao }}" \
            --notes-file notas.md $extra
